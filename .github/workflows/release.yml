name: release

# Push a tag like v0.1.0 to build static binaries, checksums and a draft release.
# Run it by hand (Actions, release, Run workflow) to build everything without publishing.
on:
  push:
    tags: ["v*"]
    branches: [release-check]   # push this branch to build everything without publishing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: aarch64-linux-gnu-gcc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup update stable && rustup target add ${{ matrix.target }}
      - name: Linux tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools gcc-aarch64-linux-gnu qemu-user-static
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
        run: cargo build --release -p use05 -p use05-cloud --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          # The aarch64 Linux binaries are static: they run here under qemu.
          RUN=""; [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ] && RUN=qemu-aarch64-static
          $RUN target/${{ matrix.target }}/release/use05 --version
          $RUN target/${{ matrix.target }}/release/use05-cloud | grep -q "own 05 console"
      - name: Package
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$V" ]; then echo "::error::tag $GITHUB_REF_NAME does not match version $V in Cargo.toml"; exit 1; fi
          D="use05-$V-${{ matrix.target }}"
          mkdir "$D" && cp "target/${{ matrix.target }}/release/use05" "target/${{ matrix.target }}/release/use05-cloud" "$D/"
          cp LICENSE* README.md "$D/" 2>/dev/null || true
          tar czf "$D.tar.gz" "$D"
          (command -v sha256sum >/dev/null && sha256sum "$D.tar.gz" || shasum -a 256 "$D.tar.gz") > "$D.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: use05-*.tar.gz*

  # The console, for anyone who hosts their own: one image, its data one SQLite file on a volume.
  # Built on release-check too, so a broken image shows before a tag; pushed only for a tag. It
  # builds from source and needs none of the binaries, so a macOS runner that never comes (they
  # are scarce at times) cannot hold it back. The version tag is pushed at once; latest moves only
  # once the release itself is published, and a re-run of this job after publishing moves it.
  image:
    name: console image
    if: github.ref_type == 'tag' || github.ref_name == 'release-check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker build -f crates/console/Dockerfile -t use05-console .
      - name: Push
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER}/use05-console"
          docker tag use05-console "$IMG:$V" && docker push "$IMG:$V"
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo true)
          if [ "$draft" = false ]; then
            docker tag use05-console "$IMG:latest" && docker push "$IMG:latest"
          else
            echo "The release is not published yet, so latest stays where it was. Re-run this job once it is."
          fi

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && ls -l
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "Static binaries for Linux and macOS. Verify with SHA256SUMS."
