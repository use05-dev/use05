[package]
name = "use05-core"
description = "05's engine: policy, intent, tasks, evidence, drift, gate, brief. No terminal output."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
use05-receipt = { path = "../receipt" }
use05-runner = { path = "../runner" }
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
libc = "0.2"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
