[package]
name = "use05-cloud"
description = "Connects this machine's 05 to your own 05 console. Outbound only; runs nothing it receives."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cloud"
path = "src/lib.rs"

[[bin]]
name = "use05-cloud"
path = "src/main.rs"

[dependencies]
use05-core = { path = "../core" }
use05-receipt = { path = "../receipt" }
use05-policy-edit = { path = "../policy-edit" }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
aes-gcm = "0.10"
ed25519-dalek = "2"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
tempfile = "3"
