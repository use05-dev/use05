[package]
name = "use05"
description = "05: prove and verify what agents did."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "use05"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
use05-receipt = { path = "../receipt" }
use05-runner = { path = "../runner" }
use05-core = { path = "../core" }
use05-policy-edit = { path = "../policy-edit" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
libc = "0.2"
